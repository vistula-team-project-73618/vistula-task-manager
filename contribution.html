<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Team Contribution</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    button { padding: 8px 16px; font-size: 14px; cursor: pointer; }
    #contributor-student-id { font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <h1>Team Contribution</h1>
  <button id="load-contributor">Show Contributor</button>
  <p id="contributor-student-id"></p>
  <p><a href="index.html">Back to Main Page</a></p>

  <script>
    document.getElementById('load-contributor').addEventListener('click', async () => {
      try {
        const res = await fetch('contribution.json');
        if (!res.ok) throw new Error('Failed to fetch contributor info');
        const data = await res.json();
        document.getElementById('contributor-student-id').textContent = 
          'Contributor Student ID: ' + data.contributorStudentId;
      } catch (err) {
        alert('Error loading contributor ID: ' + err.message);
      }
    });
  </script>
</body>
</html>
